<!DOCTYPE html>
 <!-- It's the HTML5 standard. -->
  <!-- In this example we use three.js from the repository. OrbitControls.js and stats.js are local (have to be?)  
       The triangle and the square is based on vertices and faces using Geometry class.
	   three.js r124 is the last release that works with Geometry class. In later releases you have to use 
	   BufferGeometry instead.   -->
 
 <html>
     <head>
         <title>Example 01 - triangle and square using Geometry class (obsolete)</title>
         <meta http-equiv="content-type" content="text/html; charset=ISO-8859-1">
 
         <!-- The following meta line optimizes the site for mobile devices. 
		 It sets the viewport size to the screen size, so it will be displayed maximized, but unscaled. -->
         <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1">
         <style type="text/css">
             body {
                 /* Set the background color of the HTML page to black */
                 background-color: #000000;
 
                 /* Hide oversized content. This prevents the scroll bars. */
                 overflow: hidden;
             } 
         </style>
         <!-- Include Three.js library -->
         <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r124/three.js"></script>
         <script src="OrbitControls.js"></script>          
		 <script src="stats.js"></script>
     </head>
	 
     <body>
          <!-- This is the canvas which replaced older div element --> 
		  <div id="Stats-output"> </div> 
		  <canvas id="c"></canvas>
 
         <!-- This JavaScript block encloses the Three.js commands -->
        <script>
		     const canvas = document.querySelector( '#c' );
             // Global scene object
			 const stats = initStats();
			 //stats.setMode(0); // 0: fps, 1: ms
			 //document.body.appendChild(stats.dom)
			 
             const scene = new THREE.Scene();
			 
 
             // Global camera object
             let camera, ctr;
			 
			 const renderer = new THREE.WebGLRenderer({antialias:true, canvas});
 
             // Initialize the scene
             init();
 
             // Render the scene (map the 3D world to the 2D scene)
             renderScene();
 
             /**
              * Initialize the scene.
              */
             function init(){
                 
                 
                  
                 // Set the background color of the renderer to black, with full opacity
                 renderer.setClearColor(0x000000, 1);
 
                 // Get the size of the inner window (content area) to create a full size renderer
                 canvasWidth = window.innerWidth;
                 canvasHeight = window.innerHeight;
 
                 // Set the renderers size to the content areas size
                 renderer.setSize(canvasWidth, canvasHeight);
 
                                  
                 // Define camera and add it to the scene.
                 camera = new THREE.PerspectiveCamera(45, canvasWidth / canvasHeight, 1, 100);
                 camera.position.set(0, 0, 10);
                 camera.lookAt(scene.position);
                 scene.add(camera);

                 ctr = new THREE.OrbitControls( camera);
				 ctr.addEventListener( 'change', renderScene );
				 
				 const axesHelper = new THREE.AxesHelper( 5 );
                 scene.add( axesHelper );
                 
 
                 // Create the triangle (or any arbitrary geometry) based on specified vertices.
				 // Three.js r124 is the highest version that accepts Geometry class
				 // For higher revisions you have to use BufferGeometry class instead 
				 // with slightly different code
                 var triangleGeometry = new THREE.Geometry();
                 triangleGeometry.vertices.push(new THREE.Vector3( 0.0,  1.0, 0.0));
                 triangleGeometry.vertices.push(new THREE.Vector3(-1.0, -1.0, 0.0));
                 triangleGeometry.vertices.push(new THREE.Vector3( 1.0, -1.0, 0.0));
                 triangleGeometry.faces.push(new THREE.Face3(2, 1, 0));
 
                 
                 var triangleMaterial = new THREE.MeshBasicMaterial({
                     color: 0xFFFFFF,      // You may use 'white' instead
                     side:THREE.BackSide   // FrontSide  DoubleSide
                 });
 
                 // Create a mesh and insert the geometry and the material. Translate the whole mesh
                 // by -1.5 on the x axis and by 4 on the z axis. Finally add the mesh to the scene.
                 var triangleMesh = new THREE.Mesh(triangleGeometry, triangleMaterial);
                 triangleMesh.position.set(-1.5, 0.0, 4.0);
                 scene.add(triangleMesh);
 
                 // The creation of the square is done in the same way as the triangle.
                 // 1. Instantiate the geometry object
                 // 2. Add the vertices
                 // 3. Define the faces by setting the vertices indices
                 var squareGeometry = new THREE.Geometry();
                 squareGeometry.vertices.push(new THREE.Vector3(-1.0,  1.0, 0.0));
                 squareGeometry.vertices.push(new THREE.Vector3( 1.0,  1.0, 0.0));
                 squareGeometry.vertices.push(new THREE.Vector3( 1.0, -1.0, 0.0));
                 squareGeometry.vertices.push(new THREE.Vector3(-1.0, -1.0, 0.0));
                 //squareGeometry.faces.push(new THREE.Face4(0, 1, 2, 3));         //No more Face4 in Three.js
				 squareGeometry.faces.push(new THREE.Face3(0, 1, 2));
				 squareGeometry.faces.push(new THREE.Face3(0, 2, 3));
 
                 // Create a white basic material and activate the 'Doubleside' attribute 
				 // (alternatives are: 'FrontSide' and 'BackSide')
                 var squareMaterial = new THREE.MeshBasicMaterial({
                     color:0xFFFFFF,
                     side:THREE.DoubleSide
                 });
 
                 // Create a mesh and insert the geometry and the material. Translate the whole mesh
                 // by 1.5 on the x axis and by 4 on the z axis and add the mesh to the scene.
                 var squareMesh = new THREE.Mesh(squareGeometry, squareMaterial);
                 squareMesh.position.set(1.5, 0.0, 4.0);
                 scene.add(squareMesh);
             }
 
             /**
              * Render the scene. Map the 3D world to the 2D screen.
              */
             function renderScene(){
			     stats.update();
                 renderer.render(scene, camera);
             }
			 
			 function initStats() {

                 const stats = new Stats();

                 stats.setMode(0); // 0: fps, 1: ms

                 // Align top-left
                 stats.domElement.style.position = 'absolute';
                 stats.domElement.style.left = '0px';
                 stats.domElement.style.top = '0px';
				 
				 document.getElementById("Stats-output").appendChild(stats.domElement);

                 
            return stats;
            }
         </script>
     </body>
</html>
